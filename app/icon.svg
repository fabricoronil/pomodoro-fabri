<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Ícono de la pestaña: mismo lenguaje visual que el logo de la app
    (cuadrado redondeado + anillo con el corte arriba, como el progreso del
    timer) pero con agujas de reloj para que se lea de un vistazo en 16px.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="#0b0d14" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="url(#g)" stroke-opacity=".45" stroke-width="3" />

  <!-- anillo abierto arriba: el gesto del timer corriendo -->
  <circle
    cx="32" cy="33" r="17"
    fill="none" stroke="url(#g)" stroke-width="5.5" stroke-linecap="round"
    stroke-dasharray="80 27" transform="rotate(-58 32 33)"
  />

  <!-- agujas -->
  <path d="M32 33V22.5" stroke="#f2f4fb" stroke-width="4.5" stroke-linecap="round" />
  <path d="M32 33h7.5" stroke="#f2f4fb" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="32" cy="33" r="2.6" fill="#0b0d14" />
</svg>
